  humanURL: https://docs.uniblock.dev/reference/unified-api-reference-overview
  properties:
  - url: https://docs.uniblock.dev/reference/unified-api-reference-overview
    type: Documentation
  - url: openapi/uniblock-json-rpc-api-openapi.yml
    type: OpenAPI
  description: >-
    The Uniblock JSON-RPC API provides a single endpoint for standard JSON-RPC calls across hundreds of
    blockchain networks. Rather than managing individual node provider connections for each chain, developers
    can send JSON-RPC requests through Uniblock which automatically selects the best upstream node provider.
    This supports standard Ethereum and EVM-compatible JSON-RPC methods, as well as Solana and other chain-specific
    RPC interfaces, with built-in failover and automatic retries.
