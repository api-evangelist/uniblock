- aid: uniblock:json-rpc-api
  name: Uniblock JSON-RPC API
  tags:
  - Blockchain
  - EVM
  - JSON-RPC
  - Nodes
  - Web3
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
